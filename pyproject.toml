[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talkies-local"
version = "0.1.0"
description = "Fast, private, local-first dictation and meeting transcription for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Himadri" }]
dependencies = [
  "faster-whisper>=1.1.1,<2",
]

[project.scripts]
talkies = "talkies.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/talkies"]
include = ["src/talkies/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
