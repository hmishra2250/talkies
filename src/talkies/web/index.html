<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talkies</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23176c5a'/%3E%3Cpath d='M9 10v12m7-16v20m7-16v12' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Talkies</h1>
          <p id="serviceState">Connecting</p>
        </div>
        <button id="refreshButton" class="icon-button" type="button" title="Refresh" aria-label="Refresh">
          Refresh
        </button>
      </header>

      <section class="metrics" aria-label="Dashboard metrics">
        <article>
          <span>Today</span>
          <strong id="wordsToday">0</strong>
        </article>
        <article>
          <span>This week</span>
          <strong id="wordsWeek">0</strong>
        </article>
        <article>
          <span>Speed</span>
          <strong id="wpm">-</strong>
        </article>
        <article>
          <span>Items</span>
          <strong id="transcriptCount">0</strong>
        </article>
      </section>

      <section class="workspace">
        <aside class="history-panel" aria-label="Transcript history">
          <div class="filters">
            <label>
              <span>Search</span>
              <input id="searchInput" type="search" autocomplete="off" />
            </label>
            <label>
              <span>Status</span>
              <select id="statusFilter">
                <option value="">All</option>
                <option value="pasted">Pasted</option>
                <option value="saved">Saved</option>
                <option value="cancelled">Cancelled</option>
                <option value="failed">Failed</option>
              </select>
            </label>
          </div>
          <div id="historyList" class="history-list" role="list"></div>
        </aside>

        <section class="detail-panel" aria-label="Transcript detail">
          <div class="detail-header">
            <div>
              <span id="detailMeta" class="eyebrow">No item selected</span>
              <h2 id="detailTitle">History</h2>
            </div>
            <div class="toolbar">
              <button
                id="cancelButton"
                class="icon-button"
                type="button"
                title="Mark cancelled"
                aria-label="Mark cancelled"
              >
                Mark cancelled
              </button>
              <button
                id="pasteButton"
                class="icon-button"
                type="button"
                title="Copy for paste"
                aria-label="Copy for paste"
              >
                Copy for paste
              </button>
            </div>
          </div>
          <audio id="audioPlayer" controls></audio>
          <textarea id="editor" spellcheck="true"></textarea>
          <div class="editor-footer">
            <span id="editState">Ready</span>
            <button id="saveButton" type="button">Save Correction</button>
          </div>
        </section>

        <aside class="settings-panel" aria-label="Settings">
          <h2>Settings</h2>
          <dl>
            <div>
              <dt>Model</dt>
              <dd id="modelSetting">-</dd>
            </div>
            <div>
              <dt>Paste</dt>
              <dd id="pasteSetting">-</dd>
            </div>
            <div>
              <dt>Audio</dt>
              <dd id="audioSetting">-</dd>
            </div>
          </dl>
          <section class="hotkey-settings" aria-labelledby="hotkeyHeading">
            <div class="section-heading">
              <h2 id="hotkeyHeading">Hotkey</h2>
              <span id="hotkeyCurrent" class="status-pill">-</span>
            </div>
            <div class="hotkey-card">
              <label for="hotkeyBinding">Binding</label>
              <div class="hotkey-input-row">
                <input id="hotkeyBinding" name="hotkeyBinding" autocomplete="off" spellcheck="false" />
                <button id="clearHotkeyButton" type="button" title="Clear binding">Clear</button>
              </div>
              <label for="hotkeyPreset">Alternative key</label>
              <select id="hotkeyPreset" name="hotkeyPreset">
                <option value="">Choose a key</option>
                <option value="Hyper_L">Hyper key</option>
                <option value="Super_R">Right Super</option>
                <option value="Alt_R">Right Alt</option>
                <option value="Caps_Lock">Caps Lock</option>
                <option value="Control_R">Right Ctrl</option>
              </select>
              <div class="hotkey-actions">
                <button id="captureHotkeyButton" type="button">Capture key press</button>
                <button id="saveHotkeyButton" type="button">Save</button>
              </div>
              <p id="hotkeyState" role="status" aria-live="polite"></p>
            </div>
          </section>
          <h2>Breakdown</h2>
          <div id="breakdown" class="breakdown"></div>
          <h2>Dictionary</h2>
          <form id="dictionaryForm" class="dictionary-form">
            <label for="dictionaryPhrase">Spoken phrase</label>
            <input id="dictionaryPhrase" name="phrase" maxlength="100" required />
            <label for="dictionaryReplacement">Write as</label>
            <input id="dictionaryReplacement" name="replacement" maxlength="200" required />
            <button type="submit">Add replacement</button>
          </form>
          <p id="dictionaryState" role="status" aria-live="polite"></p>
          <div id="dictionary" class="dictionary"></div>
        </aside>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
